<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Aether</title>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #1F1F20;
        /* Sem zoom, sem rolagem, sem menu/seleção no toque longo (JOGO-0 §3, "Na Web") */
        touch-action: none; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        font-family: sans-serif; color: #fff;
      }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #aether-loading { position: fixed; left: 50%; top: 50%; width: 50%; height: 6px; transform: translate(-50%, -50%); background: #333; display: none; }
      #aether-loading-bar { width: 0%; height: 100%; background: #fff; }
      #unity-warning { position: fixed; left: 50%; top: 5%; transform: translateX(-50%); display: none; }
      .aether-cover { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #000; font-size: 20px; z-index: 10; }
      /* Web não trava a orientação: em paisagem, o overlay cobre a tela (JOGO-0 §2) */
      @media (orientation: landscape) { .aether-mobile #aether-rotate { display: flex; } }
      .aether-desktop #aether-desktop { display: flex; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="aether-loading"><div id="aether-loading-bar"></div></div>
    <div id="unity-warning"></div>
    <div id="aether-rotate" class="aether-cover">Gire o celular</div>
    <div id="aether-desktop" class="aether-cover">Este protótipo é de celular.</div>
    <script>
      // Desktop = sem tela de toque como entrada principal. Lá o jogo nem carrega (JOGO-0 §2).
      var isMobile = window.matchMedia("(pointer: coarse)").matches;
      document.documentElement.className = isMobile ? "aether-mobile" : "aether-desktop";

      if (isMobile) {
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); });
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
          var warningBanner = document.querySelector("#unity-warning");
          function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }
          var div = document.createElement("div");
          div.innerHTML = msg;
          warningBanner.appendChild(div);
          if (type == "error") div.style = "background: red; padding: 10px;";
          else {
            if (type == "warning") div.style = "background: yellow; color: #000; padding: 10px;";
            setTimeout(function () {
              warningBanner.removeChild(div);
              updateBannerVisibility();
            }, 5000);
          }
          updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Web.loader.js";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/Web.data.unityweb",
          frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
          codeUrl: buildUrl + "/Web.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Aether",
          productVersion: "1.0",
          showBanner: unityShowBanner,
        };

        document.querySelector("#aether-loading").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#aether-loading-bar").style.width = 100 * progress + "%";
          }).then(function () {
            document.querySelector("#aether-loading").style.display = "none";
          }).catch(function (message) {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
